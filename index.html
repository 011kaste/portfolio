<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alessandro Castellani · Interactive Portfolio</title>
<meta name="description" content="Alessandro Castellani, communication designer and strategist. An interactive portfolio: ask a question, then open the full PDF.">
<meta name="theme-color" content="#d9ddd9">

<meta property="og:type" content="website">
<meta property="og:title" content="Alessandro Castellani · Interactive Portfolio">
<meta property="og:description" content="Communication designer and strategist. Ask a question, then open the full portfolio.">
<meta property="og:image" content="https://011kaste.github.io/portfolio/assets/idle.jpg">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="900">
<meta property="og:url" content="https://011kaste.github.io/portfolio/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Alessandro Castellani · Interactive Portfolio">
<meta name="twitter:description" content="Communication designer and strategist. Ask a question, then open the full portfolio.">
<meta name="twitter:image" content="https://011kaste.github.io/portfolio/assets/idle.jpg">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/idle.jpg">
<link rel="preload" as="image" href="assets/speak2.jpg">
<link rel="preload" as="image" href="assets/speak3.jpg">
<link rel="preload" as="image" href="assets/speak4.jpg">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9ddd9;font-family:Inter,Arial,Helvetica,sans-serif}
button{font:inherit}
.experience{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#d9ddd9;color:#111}
#sceneWrap{position:absolute;inset:0;overflow:hidden;background:#d9ddd9}
.sceneLayer{position:absolute;inset:-1.5%;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .13s linear,transform .18s ease-out;will-change:opacity,transform}
.sceneLayer.visible{opacity:1}
#sceneIdle{background-image:url("assets/idle.jpg");opacity:1}
#scene1{background-image:url("assets/idle.jpg")}
#scene2{background-image:url("assets/speak2.jpg")}
#scene3{background-image:url("assets/speak3.jpg")}
#scene4{background-image:url("assets/speak4.jpg")}
.vignette,.grain,.overlay{position:absolute;inset:0;pointer-events:none}
.overlay{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.055));z-index:10}
.vignette{background:radial-gradient(circle at 50% 45%,transparent 42%,rgba(0,0,0,.13) 100%);z-index:11}
.grain{z-index:12;opacity:.06;background-image:radial-gradient(circle,rgba(0,0,0,.17) 1px,transparent 1px);background-size:10px 10px;mix-blend-mode:multiply}
.ui{position:absolute;inset:0;z-index:20}
.brand{position:absolute;top:28px;left:38px;color:rgba(255,255,255,.96);font-size:14px;letter-spacing:3.4px;text-transform:uppercase}
.topBtn{position:absolute;top:18px;right:28px;border:1px solid rgba(30,30,30,.45);background:rgba(242,244,240,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;color:#111;padding:14px 24px;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.talkBtn{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.78);background:rgba(15,15,15,.45);color:#fff;padding:13px 24px;border-radius:999px;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.openHint{position:absolute;right:14.4%;bottom:24.3%;display:flex;align-items:center;gap:10px;color:#191919;background:rgba(245,246,241,.30);padding:8px 12px;border-radius:10px;font-size:14px;letter-spacing:1.1px;text-transform:uppercase;cursor:pointer;border:0}
.keyCap{width:24px;height:24px;border:1px solid #222;display:grid;place-items:center;border-radius:4px;font-size:11px;background:rgba(255,255,255,.5)}
.questionDock{position:absolute;left:24px;bottom:24px;width:min(420px,92vw);background:rgba(242,244,240,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(18,18,18,.14);border-radius:26px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.14);transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.questionDock.show{transform:translateY(0)}
.dockTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dockEyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:#4e534f}
.dockClose{border:0;background:transparent;font-size:24px;cursor:pointer}
.questions{display:grid;gap:9px}
.question{border:1px solid rgba(18,18,18,.11);background:rgba(255,255,255,.46);border-radius:16px;padding:14px;cursor:pointer;text-align:left;font-size:14px;line-height:1.3;color:#161616}
.question:hover{background:#141414;color:white}
.subtitle{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(1030px,68vw);background:rgba(10,10,10,.72);color:white;padding:16px 18px;border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);line-height:1.45;font-size:15px;opacity:0;transition:opacity .2s;box-shadow:0 12px 50px rgba(0,0,0,.22);pointer-events:none}
.subtitle.show{opacity:1}
.subtitle .label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.66);margin-bottom:7px}
.subtitle .questionLabel{display:block;color:rgba(255,255,255,.82);font-size:12px;margin-bottom:8px}
.cornerNote{position:absolute;right:28px;bottom:18px;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.72)}
.pdfModal{position:fixed;inset:0;z-index:40;display:none;background:rgba(8,8,8,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pdfModal.show{display:block}
.pdfTop{position:absolute;left:24px;right:24px;top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:white}
.pdfTitle{font-size:12px;letter-spacing:2px;text-transform:uppercase}
.pdfActions{display:flex;gap:8px}
.pdfClose,.pdfOpen{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.06);color:white;border-radius:999px;padding:10px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:1.8px;font-size:11px;text-decoration:none;font-family:inherit}
.pdfFrame{position:absolute;inset:72px 24px 24px;background:#111;border-radius:14px;overflow:hidden}
.pdfFrame iframe{width:100%;height:100%;border:0;background:white}
@media(max-width:900px){
  .brand{font-size:11px;left:18px;top:20px}
  .topBtn{right:16px;top:14px;padding:12px 16px;font-size:10px}
  .talkBtn{top:auto;bottom:30vh}
  .openHint{right:16px;bottom:24vh;font-size:12px}
  .subtitle{width:calc(100vw - 24px);left:12px;right:12px;transform:none;bottom:14px;font-size:14px}
  .questionDock{left:14px;right:14px;width:auto;bottom:14px}
  .cornerNote{display:none}
  .pdfTitle{display:none}
  .pdfFrame{inset:64px 10px 10px}
}
@media(max-width:600px){
  .brand{font-size:10px;letter-spacing:2px;top:24px;left:16px;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topBtn{padding:11px 13px;font-size:9px;letter-spacing:1.5px}
}
</style>
</head>
<body>
<main class="experience" id="experience">
  <div id="sceneWrap">
    <div class="sceneLayer visible" id="sceneIdle"></div>
    <div class="sceneLayer" id="scene1"></div>
    <div class="sceneLayer" id="scene2"></div>
    <div class="sceneLayer" id="scene3"></div>
    <div class="sceneLayer" id="scene4"></div>
  </div>
  <div class="overlay"></div><div class="vignette"></div><div class="grain"></div>
  <section class="ui">
    <div class="brand">ALESSANDRO CASTELLANI</div>
    <button class="topBtn" id="openProjects">VAI AI PROGETTI →</button>
    <button class="talkBtn" id="talkBtn">TALK TO ME</button>
    <button class="openHint" id="openPortfolio"><span class="keyCap">E</span><span>APRI IL PORTFOLIO</span></button>
    <div class="questionDock" id="questionDock">
      <div class="dockTop"><div class="dockEyebrow">Interactive interview</div><button class="dockClose" id="dockClose" aria-label="Close">×</button></div>
      <div class="questions" id="questions"></div>
    </div>
    <div class="subtitle" id="subtitle"><span class="label">Alessandro speaking</span><span class="questionLabel" id="questionLabel"></span><span id="subtitleText"></span></div>
    <div class="cornerNote">MOVE THE MOUSE / PRESS E / ESCAPE TO CLOSE</div>
  </section>
</main>

<section class="pdfModal" id="pdfModal">
  <div class="pdfTop">
    <div class="pdfTitle">Alessandro Castellani · Portfolio PDF</div>
    <div class="pdfActions">
      <a class="pdfOpen" href="assets/portfolio.pdf" target="_blank" rel="noopener">Open in new tab</a>
      <button class="pdfClose" id="pdfClose">Close PDF</button>
    </div>
  </div>
  <div class="pdfFrame"><iframe id="pdfFrame" title="Portfolio PDF"></iframe></div>
</section>

<script>
const PDF_URL='assets/portfolio.pdf';
const interview=[{"q": "Tell me about yourself.", "a": "I\u2019m Alessandro Castellani, a communication designer and strategist. My work sits between research, storytelling, branding and visual culture, with a strong interest in contemporary art and editorial thinking."}, {"q": "What kind of projects do you work on?", "a": "I work on projects that mix concept, strategy and communication design. In the portfolio you\u2019ll find branding, cultural positioning, integrated campaigns, archival thinking and editorial or curatorial work."}, {"q": "How do you approach strategy?", "a": "I usually begin with observation and context. I look for tensions, habits and contradictions, then build an insight and a clear positioning before translating it into narrative, form and communication."}, {"q": "Show me something you\u2019re proud of.", "a": "One project I\u2019m proud of is Nikon Base-Archive, where I reframed Nikon around authenticity and visual evidence, turning photography into something to preserve, certify and experience as proof of reality."}, {"q": "Why the United States?", "a": "Because I want to place my work in a context where strategy, design, storytelling and experience can really intersect. I want the portfolio itself to act as a case study of how I think, not just a container of finished work."}];
const exp=document.getElementById('experience'),dock=document.getElementById('questionDock'),qEl=document.getElementById('questions'),subtitle=document.getElementById('subtitle'),subtitleText=document.getElementById('subtitleText'),questionLabel=document.getElementById('questionLabel'),pdfModal=document.getElementById('pdfModal'),pdfFrame=document.getElementById('pdfFrame');
const layers=[...document.querySelectorAll('.sceneLayer')],idle=document.getElementById('sceneIdle'),frames=[scene1,scene2,scene3,scene4];
let typing=null,speakInt=null,speakStop=null,fi=0,pdfLoaded=false;
function showOnly(el){layers.forEach(l=>l.classList.remove('visible'));el.classList.add('visible')}
function stopSpeaking(){clearInterval(speakInt);clearTimeout(speakStop);showOnly(idle)}
function startSpeaking(ms){stopSpeaking();fi=0;speakInt=setInterval(()=>{showOnly(frames[fi%frames.length]);fi++},185);speakStop=setTimeout(stopSpeaking,ms)}
function typeText(t){clearInterval(typing);subtitleText.textContent='';let i=0;typing=setInterval(()=>{subtitleText.textContent=t.slice(0,i++);if(i>t.length)clearInterval(typing)},16)}
function play(item){questionLabel.textContent=item.q;subtitle.classList.add('show');typeText(item.a);startSpeaking(Math.min(Math.max(item.a.length*52,3500),12000))}
interview.forEach(item=>{const b=document.createElement('button');b.className='question';b.textContent=item.q;b.onclick=()=>play(item);qEl.appendChild(b)});
// iOS Safari and most mobile browsers render PDFs poorly inside an iframe, so open the file directly there.
const mobilePdf=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
function openPdf(){
  if(mobilePdf){window.open(PDF_URL,'_blank','noopener');return}
  if(!pdfLoaded){pdfFrame.src=PDF_URL;pdfLoaded=true}
  pdfModal.classList.add('show')
}
function closePdf(){pdfModal.classList.remove('show')}
document.getElementById('talkBtn').onclick=()=>dock.classList.add('show');
document.getElementById('dockClose').onclick=()=>dock.classList.remove('show');
document.getElementById('openProjects').onclick=openPdf;
document.getElementById('openPortfolio').onclick=openPdf;
document.getElementById('pdfClose').onclick=closePdf;
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e')openPdf();if(e.key==='Escape'){closePdf();dock.classList.remove('show');subtitle.classList.remove('show');stopSpeaking()}});
exp.addEventListener('mousemove',e=>{const r=exp.getBoundingClientRect(),x=(e.clientX-r.width/2)/r.width,y=(e.clientY-r.height/2)/r.height;layers.forEach(l=>l.style.transform=`translate3d(${(x*-14).toFixed(1)}px,${(y*-9).toFixed(1)}px,0) scale(1.018)`)});
exp.addEventListener('mouseleave',()=>layers.forEach(l=>l.style.transform='scale(1.018)'));
layers.forEach(l=>l.style.transform='scale(1.018)');
</script>
</body>
</html>
