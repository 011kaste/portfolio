<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9ddd9;font-family:Inter,Arial,Helvetica,sans-serif}
button{font:inherit}
.experience{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#d9ddd9;color:#111}
#sceneWrap{position:absolute;inset:0;overflow:hidden;background:#d9ddd9}
.sceneLayer{position:absolute;inset:-1.5%;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .13s linear,transform .18s ease-out;will-change:opacity,transform}
.sceneLayer.visible{opacity:1}
#sceneIdle{background-image:url("assets/idle.jpg");opacity:1}
#scene1{background-image:url("assets/idle.jpg")}
#scene2{background-image:url("assets/speak2.jpg")}
#scene3{background-image:url("assets/speak3.jpg")}
#scene4{background-image:url("assets/speak4.jpg")}
.vignette,.grain,.overlay{position:absolute;inset:0;pointer-events:none}
.overlay{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.055));z-index:10}
.vignette{background:radial-gradient(circle at 50% 45%,transparent 42%,rgba(0,0,0,.13) 100%);z-index:11}
.grain{z-index:12;opacity:.06;background-image:radial-gradient(circle,rgba(0,0,0,.17) 1px,transparent 1px);background-size:10px 10px;mix-blend-mode:multiply}
.ui{position:absolute;inset:0;z-index:20;pointer-events:none}
.ui>*{pointer-events:auto}
.brand{position:absolute;top:28px;left:38px;color:rgba(255,255,255,.96);font-size:14px;letter-spacing:3.4px;text-transform:uppercase}
.topBtn{position:absolute;top:18px;right:28px;border:1px solid rgba(30,30,30,.45);background:rgba(242,244,240,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;color:#111;padding:14px 24px;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.talkBtn{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.78);background:rgba(15,15,15,.45);color:#fff;padding:13px 24px;border-radius:999px;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.openHint{position:absolute;right:14.4%;bottom:24.3%;display:flex;align-items:center;gap:10px;color:#191919;background:rgba(245,246,241,.30);padding:8px 12px;border-radius:10px;font-size:14px;letter-spacing:1.1px;text-transform:uppercase;cursor:pointer;border:0}
.keyCap{width:24px;height:24px;border:1px solid #222;display:grid;place-items:center;border-radius:4px;font-size:11px;background:rgba(255,255,255,.5)}
.questionDock{position:absolute;left:24px;bottom:24px;width:min(420px,92vw);background:rgba(242,244,240,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(18,18,18,.14);border-radius:26px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.14);transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.questionDock.show{transform:translateY(0)}
.dockTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dockEyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:#4e534f}
.dockClose{border:0;background:transparent;font-size:24px;cursor:pointer}
.questions{display:grid;gap:9px}
.question{border:1px solid rgba(18,18,18,.11);background:rgba(255,255,255,.46);border-radius:16px;padding:14px;cursor:pointer;text-align:left;font-size:14px;line-height:1.3;color:#161616}
.question:hover{background:#141414;color:white}
.subtitle{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(1030px,68vw);background:rgba(10,10,10,.72);color:white;padding:16px 18px;border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);line-height:1.45;font-size:15px;opacity:0;transition:opacity .2s;box-shadow:0 12px 50px rgba(0,0,0,.22);pointer-events:none}
.subtitle.show{opacity:1}
.subtitle .label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.66);margin-bottom:7px}
.subtitle .questionLabel{display:block;color:rgba(255,255,255,.82);font-size:12px;margin-bottom:8px}
.cornerNote{position:absolute;right:28px;bottom:18px;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.72)}
.pdfModal{position:fixed;inset:0;z-index:40;display:none;background:rgba(8,8,8,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pdfModal.show{display:block}
.pdfTop{position:absolute;left:24px;right:24px;top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:white}
.pdfTitle{font-size:12px;letter-spacing:2px;text-transform:uppercase}
.pdfActions{display:flex;gap:8px}
.pdfClose,.pdfOpen{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.06);color:white;border-radius:999px;padding:10px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:1.8px;font-size:11px;text-decoration:none;font-family:inherit}
.pdfFrame{position:absolute;inset:72px 24px 24px;background:#111;border-radius:14px;overflow:hidden}
.pdfFrame iframe{width:100%;height:100%;border:0;background:white}

/* ---- Nokia on the table ---- */
/* .stageWrap matches the scene layers exactly (same inset, same parallax transform); .stage is a 16:9 box sized like background-size:cover, so anything placed in image percentages stays glued to the photo. */
.stageWrap{position:absolute;inset:-1.5%;overflow:hidden;pointer-events:none;z-index:5;transition:transform .18s ease-out;will-change:transform}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.nokia{position:absolute;left:17.5%;top:63%;width:4.9%;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;transform-origin:50% 50%;transform:perspective(900px) rotateX(48deg) rotateZ(-22deg);filter:drop-shadow(5px 9px 7px rgba(0,0,0,.38)) drop-shadow(0 1px 1px rgba(0,0,0,.3));transition:transform .25s ease-out,filter .25s ease-out;-webkit-tap-highlight-color:transparent}
.nokia:hover,.nokia:focus-visible{transform:perspective(900px) rotateX(46deg) rotateZ(-22deg) translateY(-3px);filter:drop-shadow(7px 12px 10px rgba(0,0,0,.4)) drop-shadow(0 1px 1px rgba(0,0,0,.3));outline:0}
.nokia svg,.nokia img{display:block;width:100%;height:auto}
@keyframes ring{0%,100%{transform:perspective(900px) rotateX(48deg) rotateZ(-22deg)}20%{transform:perspective(900px) rotateX(48deg) rotateZ(-19deg) translateX(2px)}40%{transform:perspective(900px) rotateX(48deg) rotateZ(-25deg) translateX(-2px)}60%{transform:perspective(900px) rotateX(48deg) rotateZ(-19deg) translateX(2px)}80%{transform:perspective(900px) rotateX(48deg) rotateZ(-25deg) translateX(-2px)}}
.nokia.ring{animation:ring .42s linear}
@media(prefers-reduced-motion:reduce){.nokia.ring{animation:none}}
.contactHint{right:auto;left:8.5%;bottom:42%}
/* The LCD glass: dull when the phone is off, backlit green when it is on. */
.nk .lcd{fill:#7f8d68;transition:fill .15s}
.nk.on .lcd{fill:#a9cf70}
.nk .lcdTxt{opacity:0;transition:opacity .15s}
.nk.on .lcdTxt{opacity:1}

/* ---- Contacts screen: the same phone, big, with a live LCD laid over its screen ---- */
.phoneModal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(8,8,8,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.phoneModal.show{display:grid}
.bigPhone{position:relative;width:min(340px,80vw,calc(100dvh * .64));filter:drop-shadow(0 34px 60px rgba(0,0,0,.65))}
.bigPhone svg{display:block;width:100%;height:auto}
.bigPhone .lcdTxt{display:none}
/* Percentages below are the LCD rectangle of the SVG (x44 y66 w112 h98 in a 200x420 viewBox). */
.lcdUI{position:absolute;left:22%;top:15.72%;width:56%;height:23.33%;padding:4% 4.5% 3%;font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;color:#10200b;display:flex;flex-direction:column;container-type:size;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
.lcdHead{display:flex;justify-content:space-between;align-items:baseline;font-size:13cqh;line-height:1;border-bottom:1.2cqh solid rgba(16,32,11,.6);padding-bottom:1.5cqh}
.lcdList{list-style:none;margin:1.5cqh 0 0;padding:0;flex:1;display:grid;grid-auto-rows:1fr}
.lcdItem{display:flex;gap:4cqw;align-items:center;padding:0 2cqw;border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;line-height:1;font-size:12cqh;width:100%;border-radius:1px}
.lcdItem::before{content:"";width:0;height:0;border:2.2cqh solid transparent;border-left-color:currentColor;opacity:0;flex:none}
.lcdItem.sel{background:#10200b;color:#a9cf70}
.lcdItem.sel::before{opacity:1}
.lcdItem:focus{outline:0}
.lcdVal{font-size:9.5cqh;line-height:1.05;word-break:break-all;border-top:1px solid rgba(16,32,11,.4);padding-top:1.5cqh;margin-top:1cqh;min-height:2.1em}
.lcdFoot{display:flex;justify-content:space-between;font-size:10cqh;margin-top:1cqh}
.lcdFoot span{cursor:pointer}
.lcdToast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#10200b;color:#a9cf70;padding:1.5cqh 4cqw;font-size:13cqh;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
.lcdToast.show{opacity:1}
/* Invisible hit areas over the drawn keys so the phone works with the mouse and on touch. */
.hit{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;border-radius:999px;-webkit-tap-highlight-color:transparent}
.hit:active{background:rgba(255,255,255,.12)}
.hitNavi{left:35%;top:43.8%;width:30%;height:4.3%}
.hitC{left:70%;top:43.8%;width:18%;height:4.3%}
.hitUp{left:12%;top:41.9%;width:15%;height:4.1%}
.hitDown{left:12%;top:46%;width:15%;height:4.1%}
.hit0{left:39%;top:79.5%;width:22%;height:6.8%}
.hitHash{left:63%;top:78%;width:22%;height:6.8%}
.phoneClose{position:absolute;top:18px;right:24px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.06);color:white;border-radius:999px;padding:10px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:1.8px;font-size:11px;font-family:inherit}

@media(max-width:900px){
  .contactHint{left:auto;right:16px;bottom:calc(24vh + 52px);font-size:12px}
  .nokia{display:none}
  .brand{font-size:11px;left:18px;top:20px}
  .topBtn{right:16px;top:14px;padding:12px 16px;font-size:10px}
  .talkBtn{top:auto;bottom:30vh}
  .openHint{right:16px;bottom:24vh;font-size:12px}
  .subtitle{width:calc(100vw - 24px);left:12px;right:12px;transform:none;bottom:14px;font-size:14px}
  .questionDock{left:14px;right:14px;width:auto;bottom:14px}
  .cornerNote{display:none}
  .pdfTitle{display:none}
  .pdfFrame{inset:64px 10px 10px}
}
@media(max-width:600px){
  .brand{font-size:10px;letter-spacing:2px;top:24px;left:16px;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topBtn{padding:11px 13px;font-size:9px;letter-spacing:1.5px}
}
</style>
</head>
<body>
<main class="experience" id="experience">
  <div id="sceneWrap">
    <div class="sceneLayer visible" id="sceneIdle"></div>
    <div class="sceneLayer" id="scene1"></div>
    <div class="sceneLayer" id="scene2"></div>
    <div class="sceneLayer" id="scene3"></div>
    <div class="sceneLayer" id="scene4"></div>
  </div>
  <div class="stageWrap" id="stageWrap">
    <div class="stage" id="stage">
      <button class="nokia" id="nokia" aria-label="Open contacts" title="Contatti (C)">
        <!-- Nokia 3310. The same drawing is cloned into the contacts screen. Drop a transparent assets/nokia.png in the repo to replace this one on the table. -->
        <svg class="nk" id="nk" viewBox="0 0 200 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="nkBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b4463"/><stop offset=".45" stop-color="#232b45"/><stop offset="1" stop-color="#141a2d"/></linearGradient>
            <linearGradient id="nkEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.28)"/><stop offset=".3" stop-color="rgba(255,255,255,.05)"/><stop offset="1" stop-color="rgba(0,0,0,.35)"/></linearGradient>
            <linearGradient id="nkKey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f3"/><stop offset="1" stop-color="#c3c8d2"/></linearGradient>
            <linearGradient id="nkNavi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7fe0"/><stop offset="1" stop-color="#2450b3"/></linearGradient>
            <linearGradient id="nkGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.22)"/><stop offset=".5" stop-color="rgba(255,255,255,0)"/></linearGradient>
          </defs>
          <!-- body -->
          <path d="M100 3C152 3 179 18 183 54L197 150C201 192 197 240 190 282L177 380C173 405 150 417 100 417C50 417 27 405 23 380L10 282C3 240-1 192 3 150L17 54C21 18 48 3 100 3Z" fill="url(#nkBody)"/>
          <path d="M100 3C152 3 179 18 183 54L197 150C201 192 197 240 190 282L177 380C173 405 150 417 100 417C50 417 27 405 23 380L10 282C3 240-1 192 3 150L17 54C21 18 48 3 100 3Z" fill="url(#nkEdge)"/>
          <path d="M100 9C148 9 173 22 177 56L190 150C194 191 190 238 183 279L171 377C168 398 148 411 100 411C52 411 32 398 29 377L17 279C10 238 6 191 10 150L23 56C27 22 52 9 100 9Z" fill="none" stroke="rgba(255,255,255,.07)"/>
          <!-- earpiece and logo -->
          <rect x="82" y="22" width="36" height="4" rx="2" fill="#0b0e17"/>
          <text x="100" y="47" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="9" font-weight="700" letter-spacing="2.2" fill="#c9cfdc">NOKIA</text>
          <!-- screen -->
          <rect x="36" y="58" width="128" height="114" rx="14" fill="#0b0e17"/>
          <rect x="38" y="60" width="124" height="110" rx="12" fill="none" stroke="rgba(255,255,255,.08)"/>
          <rect class="lcd" x="44" y="66" width="112" height="98" rx="5"/>
          <g class="lcdTxt" font-family="VT323,monospace" fill="#10200b"><text x="50" y="82" font-size="13">Contacts</text><path d="M50 87h100" stroke="#10200b" stroke-width="1.2"/><rect x="49" y="92" width="102" height="14" fill="#10200b"/><text x="53" y="103" font-size="12" fill="#a9cf70">&#9656; Email</text><text x="53" y="121" font-size="12">  Instagram</text><text x="53" y="139" font-size="12">  LinkedIn</text><text x="53" y="157" font-size="12">  Phone</text></g>
          <rect x="44" y="66" width="112" height="49" rx="5" fill="url(#nkGlass)"/>
          <!-- navi key, C key, rocker -->
          <rect x="70" y="184" width="60" height="18" rx="9" fill="url(#nkNavi)"/>
          <rect x="70" y="184" width="60" height="18" rx="9" fill="none" stroke="rgba(255,255,255,.25)"/>
          <rect x="140" y="184" width="36" height="18" rx="9" fill="url(#nkKey)"/>
          <text x="158" y="197" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#1a2140">C</text>
          <rect x="24" y="176" width="30" height="34" rx="12" fill="url(#nkKey)"/>
          <path d="M39 183l4 6h-8zM39 203l-4-6h8z" fill="#1a2140"/>
          <!-- keypad, rows bent into the 3310 smile -->
          <g fill="url(#nkKey)" stroke="rgba(0,0,0,.25)" stroke-width=".6">
            <rect x="30" y="206" width="44" height="28" rx="12"/><rect x="78" y="212" width="44" height="28" rx="12"/><rect x="126" y="206" width="44" height="28" rx="12"/>
            <rect x="32" y="246" width="44" height="28" rx="12"/><rect x="78" y="252" width="44" height="28" rx="12"/><rect x="124" y="246" width="44" height="28" rx="12"/>
            <rect x="34" y="286" width="44" height="28" rx="12"/><rect x="78" y="292" width="44" height="28" rx="12"/><rect x="122" y="286" width="44" height="28" rx="12"/>
            <rect x="37" y="326" width="44" height="28" rx="12"/><rect x="78" y="332" width="44" height="28" rx="12"/><rect x="119" y="326" width="44" height="28" rx="12"/>
          </g>
          <g font-family="Inter,Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a2140" text-anchor="middle">
            <text x="52" y="224">1</text><text x="100" y="230">2</text><text x="148" y="224">3</text>
            <text x="54" y="264">4</text><text x="100" y="270">5</text><text x="146" y="264">6</text>
            <text x="56" y="304">7</text><text x="100" y="310">8</text><text x="144" y="304">9</text>
            <text x="59" y="344">*</text><text x="100" y="350">0</text><text x="141" y="344">#</text>
          </g>
          <g font-family="Inter,Arial,Helvetica,sans-serif" font-size="4.6" letter-spacing=".6" fill="#3a4360" text-anchor="middle">
            <text x="100" y="236">ABC</text><text x="148" y="230">DEF</text><text x="54" y="270">GHI</text><text x="100" y="276">JKL</text><text x="146" y="270">MNO</text><text x="56" y="310">PQRS</text><text x="100" y="316">TUV</text><text x="144" y="310">WXYZ</text>
          </g>
          <circle cx="100" cy="392" r="2.2" fill="#0b0e17"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="overlay"></div><div class="vignette"></div><div class="grain"></div>
  <section class="ui">
    <div class="brand">ALESSANDRO CASTELLANI</div>
    <button class="topBtn" id="openProjects">VAI AI PROGETTI →</button>
    <button class="talkBtn" id="talkBtn">TALK TO ME</button>
    <button class="openHint" id="openPortfolio"><span class="keyCap">E</span><span>APRI IL PORTFOLIO</span></button>
    <button class="openHint contactHint" id="openContacts"><span class="keyCap">C</span><span>CONTATTI</span></button>
    <div class="questionDock" id="questionDock">
      <div class="dockTop"><div class="dockEyebrow">Interactive interview</div><button class="dockClose" id="dockClose" aria-label="Close">×</button></div>
      <div class="questions" id="questions"></div>
    </div>
    <div class="subtitle" id="subtitle"><span class="label">Alessandro speaking</span><span class="questionLabel" id="questionLabel"></span><span id="subtitleText"></span></div>
    <div class="cornerNote">MOVE THE MOUSE / PRESS E / PRESS C / ESCAPE TO CLOSE</div>
  </section>
</main>

<section class="phoneModal" id="phoneModal" role="dialog" aria-modal="true" aria-label="Contacts">
  <button class="phoneClose" id="phoneClose">Close</button>
  <div class="bigPhone" id="bigPhone">
    <!-- The phone SVG is cloned here by the script, then the live LCD and the key hit areas sit on top of it. -->
    <div class="lcdUI">
      <div class="lcdHead"><span>Contacts</span><span id="lcdCount"></span></div>
      <ul class="lcdList" id="lcdList"></ul>
      <div class="lcdVal" id="lcdVal"></div>
      <div class="lcdFoot"><span id="lcdSelect">Select</span><span id="lcdCopy">Copy</span><span id="lcdBack">Back</span></div>
      <div class="lcdToast" id="lcdToast">Copied</div>
    </div>
    <button class="hit hitNavi" id="skSelect" aria-label="Select"></button>
    <button class="hit hitC" id="skBack" aria-label="Back"></button>
    <button class="hit hitUp" id="skUp" aria-label="Up"></button>
    <button class="hit hitDown" id="skDown" aria-label="Down"></button>
    <button class="hit hit0" id="sk0" aria-label="Copy"></button>
    <button class="hit hitHash" id="skHash" aria-label="Close"></button>
  </div>
</section>

<section class="pdfModal" id="pdfModal">
  <div class="pdfTop">
    <div class="pdfTitle">Alessandro Castellani · Portfolio PDF</div>
    <div class="pdfActions">
      <a class="pdfOpen" href="assets/portfolio.pdf" target="_blank" rel="noopener">Open in new tab</a>
      <button class="pdfClose" id="pdfClose">Close PDF</button>
    </div>
  </div>
  <div class="pdfFrame"><iframe id="pdfFrame" title="Portfolio PDF"></iframe></div>
</section>

<script>
const PDF_URL='assets/portfolio.pdf';
// Contacts shown on the Nokia. Edit here only.
const contacts=[
  {label:"Email",value:"a.castellani2002@gmail.com",href:"mailto:a.castellani2002@gmail.com",copy:"a.castellani2002@gmail.com"},
  {label:"Instagram",value:"@011kaste",href:"https://www.instagram.com/011kaste/",copy:"https://www.instagram.com/011kaste/"},
  {label:"LinkedIn",value:"alessandro-castellani",href:"https://www.linkedin.com/in/alessandro-castellani",copy:"https://www.linkedin.com/in/alessandro-castellani"},
  {label:"Phone",value:"+39 334 935 2928",href:"tel:+393349352928",copy:"+39 334 935 2928"}
];
const interview=[{"q": "Tell me about yourself.", "a": "I\u2019m Alessandro Castellani, a communication designer and strategist. My work sits between research, storytelling, branding and visual culture, with a strong interest in contemporary art and editorial thinking."}, {"q": "What kind of projects do you work on?", "a": "I work on projects that mix concept, strategy and communication design. In the portfolio you\u2019ll find branding, cultural positioning, integrated campaigns, archival thinking and editorial or curatorial work."}, {"q": "How do you approach strategy?", "a": "I usually begin with observation and context. I look for tensions, habits and contradictions, then build an insight and a clear positioning before translating it into narrative, form and communication."}, {"q": "Show me something you\u2019re proud of.", "a": "One project I\u2019m proud of is Nikon Base-Archive, where I reframed Nikon around authenticity and visual evidence, turning photography into something to preserve, certify and experience as proof of reality."}, {"q": "Why the United States?", "a": "Because I want to place my work in a context where strategy, design, storytelling and experience can really intersect. I want the portfolio itself to act as a case study of how I think, not just a container of finished work."}];
const exp=document.getElementById('experience'),dock=document.getElementById('questionDock'),qEl=document.getElementById('questions'),subtitle=document.getElementById('subtitle'),subtitleText=document.getElementById('subtitleText'),questionLabel=document.getElementById('questionLabel'),pdfModal=document.getElementById('pdfModal'),pdfFrame=document.getElementById('pdfFrame');
const layers=[...document.querySelectorAll('.sceneLayer')],idle=document.getElementById('sceneIdle'),frames=[scene1,scene2,scene3,scene4];
let typing=null,speakInt=null,speakStop=null,fi=0,pdfLoaded=false;
function showOnly(el){layers.forEach(l=>l.classList.remove('visible'));el.classList.add('visible')}
function stopSpeaking(){clearInterval(speakInt);clearTimeout(speakStop);showOnly(idle)}
function startSpeaking(ms){stopSpeaking();fi=0;speakInt=setInterval(()=>{showOnly(frames[fi%frames.length]);fi++},185);speakStop=setTimeout(stopSpeaking,ms)}
function typeText(t){clearInterval(typing);subtitleText.textContent='';let i=0;typing=setInterval(()=>{subtitleText.textContent=t.slice(0,i++);if(i>t.length)clearInterval(typing)},16)}
function play(item){questionLabel.textContent=item.q;subtitle.classList.add('show');typeText(item.a);startSpeaking(Math.min(Math.max(item.a.length*52,3500),12000))}
interview.forEach(item=>{const b=document.createElement('button');b.className='question';b.textContent=item.q;b.onclick=()=>play(item);qEl.appendChild(b)});
// iOS Safari and most mobile browsers render PDFs poorly inside an iframe, so open the file directly there.
const mobilePdf=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
function openPdf(){
  if(mobilePdf){window.open(PDF_URL,'_blank','noopener');return}
  if(!pdfLoaded){pdfFrame.src=PDF_URL;pdfLoaded=true}
  pdfModal.classList.add('show')
}
function closePdf(){pdfModal.classList.remove('show')}
document.getElementById('talkBtn').onclick=()=>dock.classList.add('show');
document.getElementById('dockClose').onclick=()=>dock.classList.remove('show');
document.getElementById('openProjects').onclick=openPdf;
document.getElementById('openPortfolio').onclick=openPdf;
document.getElementById('pdfClose').onclick=closePdf;

// ---- Stage: keep the phone glued to the photo whatever the viewport ratio ----
const stageWrap=document.getElementById('stageWrap'),stage=document.getElementById('stage');
function sizeStage(){const W=stageWrap.clientWidth,H=stageWrap.clientHeight,s=Math.max(W/16,H/9);stage.style.width=(16*s)+'px';stage.style.height=(9*s)+'px'}
new ResizeObserver(sizeStage).observe(stageWrap);sizeStage();
// If a real photo of the phone is added as assets/nokia.png, use it instead of the drawing.
const nokia=document.getElementById('nokia'),nk=document.getElementById('nk');
(()=>{const im=new Image();im.onload=()=>{nokia.replaceChildren(im)};im.alt='';im.src='assets/nokia.png'})();

// ---- Contacts (the Nokia) ----
const phoneModal=document.getElementById('phoneModal'),bigPhone=document.getElementById('bigPhone'),lcdList=document.getElementById('lcdList'),lcdVal=document.getElementById('lcdVal'),lcdToast=document.getElementById('lcdToast'),lcdCount=document.getElementById('lcdCount');
// Same phone in both places: clone the table drawing into the contacts screen.
const bigSvg=document.getElementById('nk').cloneNode(true);bigSvg.removeAttribute('id');bigSvg.classList.add('on');bigSvg.querySelectorAll('[id]').forEach(el=>el.id='big-'+el.id);bigSvg.innerHTML=bigSvg.innerHTML.replace(/url\(#nk/g,'url(#big-nk');bigPhone.prepend(bigSvg);
let sel=0,toastT=null,ringT=null;
contacts.forEach((c,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.className='lcdItem';b.textContent=c.label;b.onmouseenter=()=>select(i);b.onfocus=()=>select(i);b.onclick=()=>{select(i);activate()};li.appendChild(b);lcdList.appendChild(li)});
const items=[...lcdList.querySelectorAll('.lcdItem')];
function select(i){sel=(i+contacts.length)%contacts.length;items.forEach((el,k)=>el.classList.toggle('sel',k===sel));lcdVal.textContent=contacts[sel].value;lcdCount.textContent=`${sel+1}/${contacts.length}`;if(document.activeElement!==items[sel]&&phoneModal.classList.contains('show'))items[sel].focus({preventScroll:true})}
function activate(){const c=contacts[sel];if(c.href.startsWith('http'))window.open(c.href,'_blank','noopener');else location.href=c.href}
function toast(msg){lcdToast.textContent=msg;lcdToast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>lcdToast.classList.remove('show'),1100)}
function copySel(){const t=contacts[sel].copy;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast(t));else toast(t)}
function openContacts(){if(phoneModal.classList.contains('show'))return;dock.classList.remove('show');nk.classList.add('on');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;nokia.classList.remove('ring');void nokia.offsetWidth;if(!reduce)nokia.classList.add('ring');clearTimeout(ringT);ringT=setTimeout(()=>{phoneModal.classList.add('show');select(sel);items[sel].focus({preventScroll:true})},reduce?0:380)}
function closeContacts(){clearTimeout(ringT);phoneModal.classList.remove('show');nk.classList.remove('on');nokia.classList.remove('ring')}
nokia.onclick=openContacts;
document.getElementById('openContacts').onclick=openContacts;
document.getElementById('phoneClose').onclick=closeContacts;
document.getElementById('skBack').onclick=closeContacts;
document.getElementById('skHash').onclick=closeContacts;
document.getElementById('lcdBack').onclick=closeContacts;
document.getElementById('skSelect').onclick=activate;
document.getElementById('lcdSelect').onclick=activate;
document.getElementById('lcdCopy').onclick=copySel;
document.getElementById('sk0').onclick=copySel;
document.getElementById('skUp').onclick=()=>select(sel-1);
document.getElementById('skDown').onclick=()=>select(sel+1);
phoneModal.addEventListener('click',e=>{if(e.target===phoneModal)closeContacts()});
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),open=phoneModal.classList.contains('show');
  if(open){
    if(e.key==='ArrowDown'){e.preventDefault();select(sel+1)}
    else if(e.key==='ArrowUp'){e.preventDefault();select(sel-1)}
    else if(e.key==='Enter'){e.preventDefault();activate()}
    else if(k==='c'||e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeContacts()}
    else if(k==='0'||((e.metaKey||e.ctrlKey)&&k==='c')){copySel()}
    return
  }
  if(k==='c'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)openContacts();
  if(k==='e')openPdf();
  if(e.key==='Escape'){closePdf();dock.classList.remove('show');subtitle.classList.remove('show');stopSpeaking()}
});
exp.addEventListener('mousemove',e=>{const r=exp.getBoundingClientRect(),x=(e.clientX-r.width/2)/r.width,y=(e.clientY-r.height/2)/r.height;const t=`translate3d(${(x*-14).toFixed(1)}px,${(y*-9).toFixed(1)}px,0) scale(1.018)`;layers.forEach(l=>l.style.transform=t);stageWrap.style.transform=t});
exp.addEventListener('mouseleave',()=>{layers.forEach(l=>l.style.transform='scale(1.018)');stageWrap.style.transform='scale(1.018)'});
layers.forEach(l=>l.style.transform='scale(1.018)');stageWrap.style.transform='scale(1.018)';
</script>
</body>
</html>
