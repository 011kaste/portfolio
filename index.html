.vignette,.grain,.overlay{position:absolute;inset:0;pointer-events:none}
.overlay{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.055));z-index:10}
.vignette{background:radial-gradient(circle at 50% 45%,transparent 42%,rgba(0,0,0,.13) 100%);z-index:11}
.grain{z-index:12;opacity:.06;background-image:radial-gradient(circle,rgba(0,0,0,.17) 1px,transparent 1px);background-size:10px 10px;mix-blend-mode:multiply}

.ui{position:absolute;inset:0;z-index:20;pointer-events:none}
.ui>*{pointer-events:auto}
.brand{position:absolute;top:28px;left:38px;color:rgba(255,255,255,.96);font-size:14px;letter-spacing:3.4px;text-transform:uppercase;text-shadow:0 1px 14px rgba(0,0,0,.3)}
.talkBtn{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.78);background:rgba(15,15,15,.45);color:#fff;padding:11px 22px 11px 14px;border-radius:999px;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s}
.talkBtn:hover{background:rgba(15,15,15,.72)}
.openHint{position:absolute;right:14.4%;bottom:24.3%;display:flex;align-items:center;gap:10px;color:#191919;background:rgba(245,246,241,.30);padding:8px 12px;border-radius:10px;font-size:14px;letter-spacing:1.1px;text-transform:uppercase;cursor:pointer;border:0;transition:background .2s}
.openHint:hover{background:rgba(245,246,241,.62)}
.keyCap{width:24px;height:24px;border:1px solid #222;display:grid;place-items:center;border-radius:4px;font-size:11px;background:rgba(255,255,255,.5)}
.talkBtn .keyCap{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.16);color:#fff}
.kbd{display:inline-grid;place-items:center;margin-left:9px;padding:0 5px;height:18px;border:1px solid rgba(255,255,255,.4);border-radius:4px;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.85)}
.pill:hover .kbd{border-color:rgba(0,0,0,.4);color:var(--night)}

.questionDock{position:absolute;left:24px;bottom:24px;width:var(--dock-w);background:rgba(242,244,240,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(18,18,18,.14);border-radius:26px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.14);transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s linear .35s}
.questionDock.show{transform:translateY(0);visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}
.dockTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dockEyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted-dark)}
.dockClose{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:8px}
.questions{display:grid;gap:9px}
.question{border:1px solid rgba(18,18,18,.11);background:rgba(255,255,255,.46);border-radius:16px;padding:14px;cursor:pointer;text-align:left;font-size:14px;line-height:1.3;color:#161616;transition:background .15s,color .15s}
.question:hover,.question[aria-pressed="true"]{background:var(--night-2);color:#fff}

.subtitle{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(1030px,68vw);background:rgba(10,10,10,.72);color:#fff;padding:16px 18px;border-radius:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);line-height:1.45;font-size:15px;opacity:0;transition:opacity .2s;box-shadow:0 12px 50px rgba(0,0,0,.22);pointer-events:none}
.subtitle.show{opacity:1}
.subtitle .label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.66);margin-bottom:7px}
.subtitle .questionLabel{display:block;color:rgba(255,255,255,.82);font-size:12px;margin-bottom:8px}
.cornerNote{position:absolute;right:28px;bottom:18px;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.72);transition:opacity .2s}
.subtitle.show ~ .cornerNote{opacity:0}
@media (min-width:901px){
  .experience.dockOpen .subtitle{--sw:min(1030px,68vw,calc(100vw - 492px));width:var(--sw);left:max(50%,calc(468px + var(--sw) / 2))}
}
@media (hover:none){.cornerNote,.keyCap,.kbd{display:none}.talkBtn{padding:13px 24px}}

/* ---- Nokia on the table ---- */
/* .stageWrap matches the scene layers exactly (same inset, same parallax transform); .stage is a 16:9 box sized like background-size:cover, so anything placed in image percentages stays glued to the photo. */
.stageWrap{position:absolute;inset:-1.5%;overflow:hidden;pointer-events:none;z-index:5;transition:transform .18s ease-out;will-change:transform}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

  {from:27,to:31,name:"Chiaromonte",slug:"chiaromonte"},
  {from:32,to:34,name:"Tuina",slug:"tuina"},
  {from:35,to:37,name:"Cessi",slug:"cessi"},
  {from:38,to:38,name:"Contacts",slug:"contacts"},
  {from:40,to:40,name:"End of package"}
];
const PAGES=[];
for(let n=1;n<=40;n++){
  if(n===39)continue;
  const single=(n===1||n===40);
  const sec=SECTIONS.find(s=>n>=s.from&&n<=s.to);
  const pp=single?(n===1?"Cover":"Back"):`pp. ${2*n-2}–${2*n-1}`;
  PAGES.push({n,single,sec,pp,id:"p"+String(n).padStart(2,"0")});
}

const $=id=>document.getElementById(id);
const exp=$("experience"),dock=$("questionDock"),qEl=$("questions"),subtitle=$("subtitle"),subtitleText=$("subtitleText"),questionLabel=$("questionLabel"),talkBtn=$("talkBtn");
const book=$("book"),bookScroll=$("bookScroll"),bookIndex=$("bookIndex"),where=$("where"),zoom=$("zoom"),zoomScroll=$("zoomScroll"),zoomImg=$("zoomImg"),zoomLabel=$("zoomLabel");
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
const narrow=window.matchMedia("(max-width: 900px)");

/* ---------- Talking scene ---------- */
const layers=[...document.querySelectorAll(".sceneLayer")],idle=$("sceneIdle"),frames=[$("scene1"),$("scene2"),$("scene3"),$("scene4")],sleeves=$("sleevesLayer");
let typing=null,speakInt=null,speakStop=null,fi=0;
function showOnly(el){layers.forEach(l=>l.classList.remove("visible"));el.classList.add("visible")}
function stopSpeaking(){clearInterval(speakInt);clearTimeout(speakStop);showOnly(idle)}
function startSpeaking(ms){stopSpeaking();if(reduceMotion.matches)return;fi=0;speakInt=setInterval(()=>{showOnly(frames[fi%frames.length]);fi++},185);speakStop=setTimeout(stopSpeaking,ms)}
function typeText(t){clearInterval(typing);if(reduceMotion.matches){subtitleText.textContent=t;return}subtitleText.textContent="";let i=0;typing=setInterval(()=>{subtitleText.textContent=t.slice(0,i++);if(i>t.length)clearInterval(typing)},16)}
function openDock(){dock.classList.add("show");exp.classList.add("dockOpen");talkBtn.setAttribute("aria-expanded","true");if(narrow.matches){subtitle.classList.remove("show");stopSpeaking()}}
function closeDock(){dock.classList.remove("show");exp.classList.remove("dockOpen");talkBtn.setAttribute("aria-expanded","false")}
function play(item,btn){
  qEl.querySelectorAll(".question").forEach(b=>b.setAttribute("aria-pressed",String(b===btn)));
  if(narrow.matches)closeDock();
  questionLabel.textContent=item.q;subtitle.classList.add("show");typeText(item.a);
  startSpeaking(Math.min(Math.max(item.a.length*52,3500),12000));
}
interview.forEach(item=>{const b=document.createElement("button");b.type="button";b.className="question";b.textContent=item.q;b.setAttribute("aria-pressed","false");b.onclick=()=>play(item,b);qEl.appendChild(b)});
talkBtn.onclick=()=>dock.classList.contains("show")?closeDock():openDock();
$("dockClose").onclick=closeDock;

exp.addEventListener("mousemove",e=>{if(reduceMotion.matches)return;const r=exp.getBoundingClientRect(),x=(e.clientX-r.width/2)/r.width,y=(e.clientY-r.height/2)/r.height;const t=`translate3d(${(x*-14).toFixed(1)}px,${(y*-9).toFixed(1)}px,0) scale(1.018)`;layers.forEach(l=>l.style.transform=t);sleeves.style.transform=t;stageWrap.style.transform=t});
exp.addEventListener("mouseleave",()=>{layers.forEach(l=>l.style.transform="scale(1.018)");sleeves.style.transform="scale(1.018)";stageWrap.style.transform="scale(1.018)"});

/* ---------- Book ---------- */
let built=false,lastTrigger=null,currentIdx=0;
function buildBook(){
  if(built)return;built=true;
  SECTIONS.filter(s=>s.slug).forEach(s=>{
    const b=document.createElement("button");b.type="button";b.textContent=s.name;b.dataset.slug=s.slug;
    b.onclick=()=>goTo(s.slug);bookIndex.appendChild(b);
  });
  const frag=document.createDocumentFragment();
  PAGES.forEach((p,i)=>{
    const fig=document.createElement("figure");fig.className="spread"+(p.single?" single":"");fig.id=p.id;fig.dataset.idx=i;
    const w=p.single?1404:2807,h=993;
    const btn=document.createElement("button");btn.type="button";btn.className="spreadBtn";
    const label=`${p.sec.name}, ${p.pp}`;
    btn.setAttribute("aria-label",`Zoom in on ${label}`);
    const img=document.createElement("img");
    img.width=w;img.height=h;img.decoding="async";
    img.loading=i<2?"eager":"lazy";
    img.alt=`Portfolio ${label}`;
    img.sizes=p.single?"(max-width: 798px) calc(100vw - 32px), 750px":"(max-width: 1548px) calc(100vw - 48px), 1500px";
    img.srcset=`pages/sm/${p.id}.webp ${Math.round(w/2)}w, pages/lg/${p.id}.webp ${w}w`;
    img.src=`pages/sm/${p.id}.webp`;
    btn.appendChild(img);
    btn.addEventListener("click",e=>openZoom(p,e,img));
    fig.appendChild(btn);frag.appendChild(fig);
  });
  bookScroll.appendChild(frag);
  bookScroll.appendChild(buildContact());
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{if(en.isIntersecting)setCurrent(+en.target.dataset.idx)});
  },{root:bookScroll,rootMargin:"-45% 0px -45% 0px"});
  bookScroll.querySelectorAll(".spread").forEach(f=>io.observe(f));
  setCurrent(0);
}
function buildContact(){
  const box=document.createElement("section");box.className="contact";box.setAttribute("aria-label","Contacts");
  box.innerHTML=`
    <div><h2>Castellani Alessandro</h2><p>Communication Design<br>Strategist</p></div>
    <div><span class="k">Email</span><div class="row"><span class="v" id="mail">a.castellani2002@gmail.com</span><button class="pill copyBtn" type="button" id="copyMail">Copy</button></div><p style="margin-top:6px">Selected works available upon request</p></div>
    <div><span class="k">Instagram</span><a class="v" href="https://www.instagram.com/011kaste/" target="_blank" rel="noopener">@011kaste</a></div>`;
  box.querySelector("#copyMail").addEventListener("click",e=>{
    const b=e.currentTarget,t=box.querySelector("#mail").textContent;
    const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1600)};
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(box.querySelector("#mail"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected";setTimeout(()=>b.textContent="Copy",1600)};
    try{navigator.clipboard.writeText(t).then(done,fallback)}catch(err){fallback()}
  });
  return box;
}
function setCurrent(i){
  currentIdx=i;const p=PAGES[i];
  where.textContent=`${p.sec.name} · ${p.pp}`;
  const slug=p.sec.slug;
  bookIndex.querySelectorAll("button").forEach(b=>{
    const on=b.dataset.slug===slug;b.setAttribute("aria-current",String(on));
    if(on&&book.hidden===false){const bl=b.offsetLeft,br=bl+b.offsetWidth,vl=bookIndex.scrollLeft,vr=vl+bookIndex.clientWidth;if(bl<vl||br>vr)bookIndex.scrollTo({left:bl-24,behavior:reduceMotion.matches?"auto":"smooth"})}
  });
}
function scrollToIdx(i,instant){
  i=Math.max(0,Math.min(PAGES.length-1,i));
  const el=$(PAGES[i].id);if(!el)return;
  bookScroll.scrollTo({top:el.offsetTop-20,behavior:(instant||reduceMotion.matches)?"auto":"smooth"});
}
function goTo(slug,instant){
  const s=SECTIONS.find(x=>x.slug===slug);if(!s)return;
  const i=PAGES.findIndex(p=>p.n===s.from);scrollToIdx(i,instant);
}
function openBook(slug){
  lastTrigger=document.activeElement;
  buildBook();closeDock();subtitle.classList.remove("show");stopSpeaking();
  book.hidden=false;
  if(slug)requestAnimationFrame(()=>goTo(slug,true));
  bookScroll.focus({preventScroll:true});
}
function closeBook(){book.hidden=true;if(lastTrigger&&lastTrigger.focus)lastTrigger.focus({preventScroll:true})}
$("openPortfolio").onclick=()=>openBook();
$("bookClose").onclick=closeBook;

/* ---------- Zoom ---------- */
let zoomTrigger=null;
function openZoom(p,e,img){
  zoomTrigger=e.currentTarget;
  const r=img.getBoundingClientRect();
  const fx=r.width?Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)):.5;
  const fy=r.height?Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)):.5;
  zoomLabel.textContent=`${p.sec.name} · ${p.pp}`;
  zoomImg.alt=img.alt;
  zoom.hidden=false;
  const center=()=>{zoomScroll.scrollLeft=fx*zoomScroll.scrollWidth-zoomScroll.clientWidth/2;zoomScroll.scrollTop=fy*zoomScroll.scrollHeight-zoomScroll.clientHeight/2};
  zoomImg.onload=center;
  zoomImg.src=`pages/lg/${p.id}.webp`;
  if(zoomImg.complete)requestAnimationFrame(center);
  $("zoomClose").focus({preventScroll:true});
}
function closeZoom(){zoom.hidden=true;zoomImg.removeAttribute("src");if(zoomTrigger)zoomTrigger.focus({preventScroll:true})}
$("zoomClose").onclick=closeZoom;
(()=>{let down=null;
  zoomScroll.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down={x:e.clientX,y:e.clientY,l:zoomScroll.scrollLeft,t:zoomScroll.scrollTop};zoomScroll.classList.add("dragging");zoomScroll.setPointerCapture(e.pointerId)});
  zoomScroll.addEventListener("pointermove",e=>{if(!down)return;zoomScroll.scrollLeft=down.l-(e.clientX-down.x);zoomScroll.scrollTop=down.t-(e.clientY-down.y)});
  const up=()=>{down=null;zoomScroll.classList.remove("dragging")};
  zoomScroll.addEventListener("pointerup",up);zoomScroll.addEventListener("pointercancel",up);
})();

// ---- Stage: keep the phone glued to the photo whatever the viewport ratio ----
const stageWrap=document.getElementById('stageWrap'),stage=document.getElementById('stage');
function sizeStage(){const W=stageWrap.clientWidth,H=stageWrap.clientHeight,s=Math.max(W/16,H/9);stage.style.width=(16*s)+'px';stage.style.height=(9*s)+'px'}
new ResizeObserver(sizeStage).observe(stageWrap);sizeStage();
stageWrap.style.transform="scale(1.018)";
// If a real photo of the phone is added as assets/nokia.png, use it instead of the drawing.
const nokia=document.getElementById('nokia'),nk=document.getElementById('nk');
(()=>{const im=new Image();im.onload=()=>{nokia.replaceChildren(im)};im.alt='';im.src='assets/nokia.png'})();

// ---- Contacts (the Nokia) ----
const phoneModal=document.getElementById('phoneModal'),bigPhone=document.getElementById('bigPhone'),lcdList=document.getElementById('lcdList'),lcdVal=document.getElementById('lcdVal'),lcdToast=document.getElementById('lcdToast'),lcdCount=document.getElementById('lcdCount');
// Same phone in both places: clone the table drawing into the contacts screen.
const bigSvg=document.getElementById('nk').cloneNode(true);bigSvg.removeAttribute('id');bigSvg.classList.add('on');bigSvg.querySelectorAll('[id]').forEach(el=>el.id='big-'+el.id);bigSvg.innerHTML=bigSvg.innerHTML.replace(/url\(#nk/g,'url(#big-nk');bigPhone.prepend(bigSvg);
let sel=0,toastT=null,ringT=null;
contacts.forEach((c,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.className='lcdItem';b.textContent=c.label;b.onmouseenter=()=>select(i);b.onfocus=()=>select(i);b.onclick=()=>{select(i);activate()};li.appendChild(b);lcdList.appendChild(li)});
const items=[...lcdList.querySelectorAll('.lcdItem')];
function select(i){sel=(i+contacts.length)%contacts.length;items.forEach((el,k)=>el.classList.toggle('sel',k===sel));lcdVal.textContent=contacts[sel].value;lcdCount.textContent=`${sel+1}/${contacts.length}`;if(document.activeElement!==items[sel]&&phoneModal.classList.contains('show'))items[sel].focus({preventScroll:true})}
function activate(){const c=contacts[sel];if(c.href.startsWith('http'))window.open(c.href,'_blank','noopener');else location.href=c.href}
function toast(msg){lcdToast.textContent=msg;lcdToast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>lcdToast.classList.remove('show'),1100)}
function copySel(){const t=contacts[sel].copy;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast(t));else toast(t)}
function openContacts(){if(phoneModal.classList.contains('show'))return;closeDock();nk.classList.add('on');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;nokia.classList.remove('ring');void nokia.offsetWidth;if(!reduce)nokia.classList.add('ring');clearTimeout(ringT);ringT=setTimeout(()=>{phoneModal.classList.add('show');select(sel);items[sel].focus({preventScroll:true})},reduce?0:380)}
function closeContacts(){clearTimeout(ringT);phoneModal.classList.remove('show');nk.classList.remove('on');nokia.classList.remove('ring')}
nokia.onclick=openContacts;
document.getElementById('openContacts').onclick=openContacts;
document.getElementById('phoneClose').onclick=closeContacts;
document.getElementById('skBack').onclick=closeContacts;
document.getElementById('skHash').onclick=closeContacts;
document.getElementById('lcdBack').onclick=closeContacts;
document.getElementById('skSelect').onclick=activate;
document.getElementById('lcdSelect').onclick=activate;
document.getElementById('lcdCopy').onclick=copySel;
document.getElementById('sk0').onclick=copySel;
document.getElementById('skUp').onclick=()=>select(sel-1);
document.getElementById('skDown').onclick=()=>select(sel+1);
phoneModal.addEventListener('click',e=>{if(e.target===phoneModal)closeContacts()});

/* ---------- Keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(phoneModal.classList.contains("show")){
    const pk=e.key?e.key.toLowerCase():"";
    if(e.key==="ArrowDown"){e.preventDefault();select(sel+1)}
    else if(e.key==="ArrowUp"){e.preventDefault();select(sel-1)}
    else if(e.key==="Enter"){e.preventDefault();activate()}
    else if(pk==="c"&&!e.metaKey&&!e.ctrlKey||e.key==="Escape"||e.key==="Backspace"){e.preventDefault();closeContacts()}
    else if(pk==="0"||((e.metaKey||e.ctrlKey)&&pk==="c")){copySel()}
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Escape"){
    if(!zoom.hidden){closeZoom();return}
    if(!book.hidden){closeBook();return}
    closeDock();subtitle.classList.remove("show");stopSpeaking();return;
  }
  if(!zoom.hidden)return;
  const k=e.key?e.key.toLowerCase():"";
  if(!book.hidden){
    if(e.key==="ArrowRight"){e.preventDefault();scrollToIdx(currentIdx+1)}
    else if(e.key==="ArrowLeft"){e.preventDefault();scrollToIdx(currentIdx-1)}
    else if(k==="e"&&!e.repeat)closeBook();   /* E again: back to the main scene */
    return;
  }
  if(k==="e"&&!e.repeat)openBook();
  else if(k==="t"&&!e.repeat){dock.classList.contains("show")?closeDock():openDock()}
  else if(k==="c"&&!e.repeat)openContacts();
});

/* ---------- Deep links: #portfolio or a section, e.g. #pigro ---------- */
function openFromHash(){
  const h=(location.hash||"").slice(1).toLowerCase();
  if(!h)return;
  if(h==="portfolio"||h==="projects"||h==="progetti"){if(book.hidden)openBook()}
  else if(SECTIONS.some(s=>s.slug===h)){if(book.hidden)openBook(h);else goTo(h)}
}
openFromHash();
window.addEventListener("hashchange",openFromHash);
</script>
